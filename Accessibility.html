<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  ---
  :root {
    --prism-black: #0a0a0c;
    --prism-violet: #2563eb;
    --prism-violet-light: #60a5fa;
    --prism-fuchsia: #0ea5e9;
    --prism-cyan: #06b6d4;
    --prism-surface: rgba(255, 255, 255, 0.05);
    --prism-surface-hover: rgba(255, 255, 255, 0.09);
    --prism-border: rgba(255, 255, 255, 0.07);
    --prism-text: rgba(255, 255, 255, 0.92);
    --prism-text-muted: rgba(255, 255, 255, 0.48);
    --nav-bg: rgba(10,10,12,0.75);
    --nav-link-color: var(--prism-text-muted);
    --logo-gradient: linear-gradient(135deg, #0058ff 40%, #3c50ff 30%, #0fd095 100%);
    --logo-filter: drop-shadow(0 2px 10px rgba(37, 99, 235, 0.3));
    --radius: 20px;
  }

  [data-theme="light"] {
    --prism-black: #f8fafc;
    --prism-violet-light: #1d4ed8;
    --prism-surface: rgba(0, 0, 0, 0.05);
    --prism-surface-hover: rgba(0, 0, 0, 0.09);
    --prism-border: rgba(0, 0, 0, 0.15);
    --prism-text: #050505;
    --prism-text-muted: #3a3a40;
    --nav-bg: rgba(250,250,250,0.85);
    --logo-gradient: linear-gradient(135deg, #0058ff 40%, #3c50ff 30%, #0fd095 100%);
    --logo-filter: drop-shadow(0 2px 8px rgba(0,0,0,0.15));
    --nav-link-color: #000000;
  }

  body {
    font-family: 'Zoho Puvi', sans-serif;
    background: var(--prism-black);
    color: var(--prism-text);
    transition: background 0.3s ease, color 0.3s ease;
  }

  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 0 32px; height: 72px;
    display: flex; align-items: center; justify-content: space-between;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border-bottom: 1px solid transparent;
    transition: background 0.3s ease, backdrop-filter 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .nav.scrolled {
    background: var(--nav-bg);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-bottom: 1px solid var(--prism-border);
  }
  [data-theme="light"] .nav.scrolled { background: rgba(255, 255, 255, 0.78); border-bottom: 1px solid rgba(37, 99, 235, 0.06); box-shadow: 0 1px 3px rgba(37, 99, 235, 0.04), 0 4px 24px rgba(37, 99, 235, 0.03); }

  .nav-logo { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0; text-decoration: none; line-height: 1; }
  .nav-logo-mark { font-size: 26px; font-weight: 900; letter-spacing: -0.03em; background: var(--logo-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; padding-right: 0.1em; padding-bottom: 0.05em; line-height: 1; }
  .nav-logo-sub { font-size: 10px; font-weight: 600; color: var(--prism-text-muted); letter-spacing: 0.08em; text-transform: none; margin-top: 2px; }
  .nav-logo-sub .caps { text-transform: uppercase; }

  .nav-links { display: flex; align-items: center; gap: 6px; }
  .nav-links a {
    color: var(--nav-link-color, var(--prism-text-muted)); text-decoration: none; font-size: 14px; font-weight: 600;
    padding: 8px 16px; border-radius: 999px; transition: all 0.3s ease; border: none;
  }
  .nav-links a:hover { color: var(--prism-text); background: var(--prism-surface-hover); }
  .nav-links a.active { color: var(--prism-violet); background: rgba(37, 99, 235, 0.08); border: none; }

  .icon-btn {
    background: transparent; border: none; cursor: pointer;
    color: var(--prism-text-muted); padding: 8px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease; margin-left: 4px;
  }
  .icon-btn:hover { color: var(--prism-text); background: var(--prism-surface-hover); }

  /* Nav dropdown */
  .nav-dropdown { position: relative; }
  .nav-dropdown > a { display: flex; align-items: center; gap: 4px; }
  .nav-dropdown > a .nav-chevron { width: 12px; height: 12px; transition: transform 0.2s ease; }
  .nav-dropdown:hover > a .nav-chevron { transform: rotate(180deg); }
  .nav-dropdown-menu { position: absolute; top: calc(100% + 8px); right: 0; min-width: 200px; background: var(--prism-black); border: 1px solid var(--prism-border); border-radius: 12px; padding: 6px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: all 0.25s cubic-bezier(0.4,0,0.2,1); z-index: 200; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
  .nav-dropdown:hover .nav-dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
  .nav-dropdown-menu a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--prism-text-muted); text-decoration: none; transition: all 0.2s ease; background: transparent; }
  .nav-dropdown-menu a:hover { color: var(--prism-text); background: var(--prism-surface-hover); }
  .nav-dropdown-menu a svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--prism-text-muted); opacity: 0.7; }
  .nav-dropdown-menu a:hover svg { color: var(--prism-violet); opacity: 1; }
  [data-theme="light"] .nav-dropdown-menu { background: #fff; border: 1px solid rgba(37,99,235,0.10); box-shadow: 0 8px 32px rgba(37,99,235,0.10), 0 2px 8px rgba(37,99,235,0.06); }
  [data-theme="light"] .nav-dropdown-menu a { color: #64748b; }
  [data-theme="light"] .nav-dropdown-menu a:hover { color: #1e293b; background: rgba(37,99,235,0.05); }
  [data-theme="light"] .nav-dropdown-menu a:hover svg { color: #2563eb; }

  .page-content {
    padding: 140px 64px 64px;
    width: 100%;
    min-height: 100vh;
  }
  .page-title { font-size: 48px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 24px; }
</style>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');
    const currentTheme = localStorage.getItem('theme') || 'light';

    if (currentTheme === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      moonIcon.style.display = 'block';
      sunIcon.style.display = 'none';
    }

    themeToggle.addEventListener('click', () => {
      let theme = document.documentElement.getAttribute('data-theme');
      if (theme === 'light') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
        moonIcon.style.display = 'block';
        sunIcon.style.display = 'none';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        moonIcon.style.display = 'none';
        sunIcon.style.display = 'block';
      }
    });
  </script>
<script>
(function(){
  const nav = document.querySelector('.nav');
  if (!nav) return;
  const toggle = () => {
    if (window.scrollY > 10) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  };
  toggle();
  window.addEventListener('scroll', toggle, { passive: true });
})();
</script>
<script>
(function(){
  const hamburger = document.querySelector('.nav-hamburger');
  const sidebar = document.querySelector('.sidebar');
  const backdrop = document.querySelector('.sidebar-backdrop');
  const navLinks = document.querySelector('.nav-links');
  if (!hamburger || !sidebar || !backdrop) return;

  // Build a mobile-only nav section at the top of the sidebar by cloning the nav links
  if (navLinks && !sidebar.querySelector('.sidebar-mobile-nav')) {
    const mobileNav = document.createElement('div');
    mobileNav.className = 'sidebar-mobile-nav';
    const heading = document.createElement('h4');
    heading.textContent = 'Navigate';
    mobileNav.appendChild(heading);
    const ul = document.createElement('ul');
    navLinks.querySelectorAll(':scope > a').forEach(a => {
      const li = document.createElement('li');
      const clone = a.cloneNode(true);
      li.appendChild(clone);
      ul.appendChild(li);
    });
    navLinks.querySelectorAll(':scope > .nav-dropdown > .nav-dropdown-menu > a').forEach(a => {
      const li = document.createElement('li');
      const clone = a.cloneNode(true);
      li.appendChild(clone);
      ul.appendChild(li);
    });
    mobileNav.appendChild(ul);
    sidebar.insertBefore(mobileNav, sidebar.firstChild);
  }

  const open = () => {
    sidebar.classList.add('open');
    backdrop.classList.add('open');
    document.body.classList.add('sidebar-locked');
    hamburger.setAttribute('aria-expanded', 'true');
  };
  const close = () => {
    sidebar.classList.remove('open');
    backdrop.classList.remove('open');
    document.body.classList.remove('sidebar-locked');
    hamburger.setAttribute('aria-expanded', 'false');
  };
  hamburger.addEventListener('click', () => sidebar.classList.contains('open') ? close() : open());
  backdrop.addEventListener('click', close);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sidebar.classList.contains('open')) close(); });
  sidebar.addEventListener('click', (e) => { if (e.target.closest('a')) close(); });
})();
</script>
